<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Block Blast</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <p class="eyebrow">Arcade</p>
          <h1>Block Blast</h1>
        </div>
        <div class="top-actions">
          <button id="newGameBtn" class="ghost-button">New game</button>
          <button id="shuffleBtn" class="primary-button">Shuffle</button>
        </div>
      </header>

      <div class="status-row">
        <div class="status-pill"><span>Target</span><strong id="targetValue">1500</strong></div>
        <div class="status-pill"><span>Combo</span><strong id="comboValue">x1</strong></div>
        <div class="status-pill"><span>Moves</span><strong id="movesValue">0</strong></div>
      </div>

      <main class="game-layout">
        <section class="panel board-panel">
          <div class="score-row">
            <div class="stat-box">
              <span>Score</span>
              <strong id="scoreValue">0</strong>
            </div>
            <div class="stat-box">
              <span>Best</span>
              <strong id="bestValue">0</strong>
            </div>
          </div>

          <div id="board" class="board" aria-label="Game board"></div>
        </section>

        <aside class="panel tray-panel">
          <div class="tray-header">
            <h2>Pieces</h2>
            <span id="message" class="message">Pick a piece</span>
          </div>
          <div id="tray" class="tray"></div>
        </aside>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
